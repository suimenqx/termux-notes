site_name: termux-notes
site_description: Notes and practical learnings from tinkering in Termux on Android
site_url: https://suimenqx.github.io/termux-notes/
repo_url: https://github.com/suimenqx/termux-notes
repo_name: suimenqx/termux-notes

theme:
  name: material
  language: zh
  font:
    # 正文用思源宋体，阅读舒适；代码用等宽
    text: Noto Serif SC
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: brown
      accent: deep-orange
      toggle:
        icon: material/book-open-page-variant
        name: 阅读模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.tabs
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

docs_dir: notes
extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - Termux 编码会话管理器 agent-tmux: 2026-07-13-agent-tmux-coding-session-manager.md
  - Termux Extra Keys 配置完全指南: 2026-07-13-termux-extra-keys-config.md
  - Termux 下载源优化方案与使用指南: 2026-02-28-termux-mirror-optimizer-guide.md
  - Termux 下 GH 与 SSH Agent 配置: 2026-02-27-gh-and-ssh-agent.md
  - GH Pages Long-term Blog Playbook: 2026-02-27-gh-pages-long-term-blog-playbook.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.details
  - toc:
      permalink: true
      toc_depth: 3
